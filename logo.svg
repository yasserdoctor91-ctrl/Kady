<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kadyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fff5f6" />
      <stop offset="100%" stop-color="#FFDADA" />
    </linearGradient>
    
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDADA" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#FFDADA" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDADA" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFDADA" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="48" fill="url(#kadyBgGrad)" stroke="#FFDADA" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Decorative Outer Glow Ring -->
  <circle cx="250" cy="180" r="115" fill="none" stroke="url(#roseGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
  <circle cx="250" cy="180" r="105" fill="#ffffff" filter="url(#softGlow)" opacity="0.95"/>

  <!-- Botanical Cosmetics Flower Emblem (Kady Blossom) -->
  <g transform="translate(250, 180)">
    <!-- Central Soft Aura -->
    <circle cx="0" cy="0" r="38" fill="url(#roseGrad)" opacity="0.2"/>

    <!-- Petals -->
    <!-- Top Petal -->
    <path d="M0,0 C-22,-40 -15,-75 0,-90 C15,-75 22,-40 0,0 Z" fill="url(#roseGrad)" opacity="0.9"/>
    <!-- Bottom Petal -->
    <path d="M0,0 C-22,40 -15,75 0,90 C15,75 22,40 0,0 Z" fill="url(#roseGrad)" opacity="0.9"/>
    <!-- Right Petal -->
    <path d="M0,0 C40,-22 75,-15 90,0 C75,15 40,22 0,0 Z" fill="url(#blushGrad)" opacity="0.95"/>
    <!-- Left Petal -->
    <path d="M0,0 C-40,-22 -75,-15 -90,0 C-75,15 -40,22 0,0 Z" fill="url(#blushGrad)" opacity="0.95"/>

    <!-- Diagonal Soft Petals -->
    <path d="M0,0 C15,-40 45,-60 62,-62 C60,-45 40,-15 0,0 Z" fill="url(#petalGrad)" opacity="0.8"/>
    <path d="M0,0 C-15,-40 -45,-60 -62,-62 C-60,-45 -40,-15 0,0 Z" fill="url(#petalGrad)" opacity="0.8"/>
    <path d="M0,0 C15,40 45,60 62,62 C60,45 40,15 0,0 Z" fill="url(#petalGrad)" opacity="0.8"/>
    <path d="M0,0 C-15,40 -45,60 -62,62 C-60,45 -40,15 0,0 Z" fill="url(#petalGrad)" opacity="0.8"/>

    <!-- Center Gem / Sparkle -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#FFDADA" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#e11d48"/>
  </g>

  <!-- Brand Typography: KADY -->
  <text x="250" y="375" text-anchor="middle" font-family="'Cairo', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="64" fill="#1f2937" letter-spacing="4">KADY</text>

  <!-- Brand Subtitle: لمستحضرات التجميل -->
  <text x="250" y="420" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="700" font-size="24" fill="#e11d48" letter-spacing="1">لمستحضرات التجميل</text>

  <!-- Subtle bottom accent line -->
  <path d="M190,442 L310,442" stroke="url(#roseGrad)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
